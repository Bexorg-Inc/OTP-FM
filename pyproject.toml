[project]
name = "otpfm"
version = "0.1.0"
description = "OTP-FM: Multimarginal flow matching with optimal transport potentials"
authors = [{name = "Raghav Kansal", email = "raghav.kansal@bexorg.com"}]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["flow matching", "optimal transport", "deep learning", "generative models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
w2 = ["pot>=0.9"]             # For W2Potential
all = ["otpfm[w2]"]           # All optional core deps
experiments = [
    "otpfm[all]",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.0",
    "pillow>=10.0",           # For animations
    "phate>=2.0.0",           # For single-cell visualization
]
dev = [
    "pytest>=9.0",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/raghavkansal/otpfm"
Documentation = "https://github.com/raghavkansal/otpfm"
Repository = "https://github.com/raghavkansal/otpfm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otpfm", "src/fm_explore", "experiments"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # Line too long
    "E741",  # Ambiguous variable name (math notation)
    "F841",  # Local variable never used (intentional in some cases)
    "B007",  # Loop control variable not used (intentional in some cases)
    "B027",  # Empty ABC method without abstractmethod
    "B904",  # Raise from err
    "B905",  # zip without strict
    "W291",  # Trailing whitespace
    "W293",  # Blank line with whitespace
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pixi configuration for development
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
otpfm = { path = ".", editable = true }
torchdiffeq = ">=0.2.5"
phate = ">=2.0.0"

[tool.pixi.tasks]

[tool.pixi.dependencies]
pytorch = ">=2.0"
ipykernel = ">=7.1.0,<8"
matplotlib = ">=3.10.7,<4"
ipympl = ">=0.9.8,<0.10"
voila = ">=0.5.11,<0.6"
pot = ">=0.9.6.post1,<0.10"
pytest = ">=9.0.2,<10"
addict = ">=2.4.0,<3"
pytorch-warmup = ">=0.2.0,<0.3"
torch-ema = ">=0.3,<0.4"
scikit-learn = ">=1.0"
pandas = ">=2.0"
scipy = ">=1.10"
tqdm = ">=4.0"
pillow = ">=10.0"
black = ">=24.0"
ruff = ">=0.4"
pre-commit = ">=3.0"
